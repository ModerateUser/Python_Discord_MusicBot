<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ bot_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Tailwind Configuration */
        @layer base {
            body {
                @apply bg-gray-900 text-gray-100;
            }
        }

        /* Status Colors */
        .status-online { color: #10b981; }
        .status-offline { color: #ef4444; }
        .status-warning { color: #f59e0b; }
        
        /* Card Animations */
        .card { 
            transition: transform 0.2s, box-shadow 0.2s; 
        }
        .card:hover { 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        /* Pulse Animation */
        .pulse { 
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; 
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* Smooth Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Navigation Active State */
        .nav-link-active {
            @apply bg-purple-600 text-white;
        }

        /* Button Styles */
        .btn-primary {
            @apply px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-semibold transition-colors duration-200;
        }
        .btn-secondary {
            @apply px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-semibold transition-colors duration-200;
        }
        .btn-success {
            @apply px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold transition-colors duration-200;
        }
        .btn-danger {
            @apply px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-semibold transition-colors duration-200;
        }

        /* Badge Styles */
        .badge {
            @apply inline-block px-3 py-1 rounded-full text-xs font-semibold;
        }
        .badge-success {
            @apply bg-green-600 text-white;
        }
        .badge-danger {
            @apply bg-red-600 text-white;
        }
        .badge-warning {
            @apply bg-yellow-600 text-white;
        }
        .badge-info {
            @apply bg-blue-600 text-white;
        }

        /* Alert Styles */
        .alert {
            @apply p-4 rounded-lg mb-4;
        }
        .alert-info {
            @apply bg-blue-900 border-l-4 border-blue-500 text-blue-100;
        }
        .alert-warning {
            @apply bg-yellow-900 border-l-4 border-yellow-500 text-yellow-100;
        }
        .alert-danger {
            @apply bg-red-900 border-l-4 border-red-500 text-red-100;
        }
        .alert-success {
            @apply bg-green-900 border-l-4 border-green-500 text-green-100;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #a855f7;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo and Brand -->
                <div class="flex items-center">
                    <i class="fas fa-music text-purple-500 text-2xl mr-3"></i>
                    <span class="text-xl font-bold">{{ bot_name }}</span>
                </div>
                
                <!-- Navigation Links -->
                <div class="flex space-x-2">
                    <a href="/" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors {% if request.path == '/' %}nav-link-active{% endif %}">
                        <i class="fas fa-home mr-1"></i>Dashboard
                    </a>
                    <a href="/config" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors {% if request.path == '/config' %}nav-link-active{% endif %}">
                        <i class="fas fa-cog mr-1"></i>Config
                    </a>
                    <a href="/logs" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors {% if request.path == '/logs' %}nav-link-active{% endif %}">
                        <i class="fas fa-file-alt mr-1"></i>Logs
                    </a>
                    <a href="/api/docs" target="_blank" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors">
                        <i class="fas fa-book mr-1"></i>API
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center space-x-4">
                    <p class="text-gray-400 text-sm">{{ bot_name }} v{{ version }}</p>
                    <span class="text-gray-600">|</span>
                    <div class="flex items-center space-x-2">
                        <span class="text-gray-400 text-sm">Bridge:</span>
                        <span id="bridge-status" class="text-sm status-offline">Checking...</span>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-gray-400 text-sm">WebSocket:</span>
                    <span id="ws-status" class="text-sm status-offline">Disconnected</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Global Scripts -->
    <script>
        // Global WebSocket connection
        let ws = null;
        let reconnectInterval = null;

        // Connect to WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                updateWSStatus('Connected', true);
                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
                // Call page-specific handler if exists
                if (typeof onWebSocketConnected === 'function') {
                    onWebSocketConnected();
                }
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('WebSocket message:', data);
                // Call page-specific handler if exists
                if (typeof onWebSocketMessage === 'function') {
                    onWebSocketMessage(data);
                }
            };
            
            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateWSStatus('Disconnected', false);
                
                // Attempt to reconnect
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(() => {
                        console.log('Attempting to reconnect...');
                        connectWebSocket();
                    }, 5000);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        // Update WebSocket status indicator
        function updateWSStatus(text, connected) {
            const statusEl = document.getElementById('ws-status');
            if (statusEl) {
                statusEl.textContent = text;
                statusEl.className = connected ? 'text-sm status-online' : 'text-sm status-offline';
            }
        }

        // Check bridge status
        async function checkBridgeStatus() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                const bridgeEl = document.getElementById('bridge-status');
                if (bridgeEl) {
                    if (data.bridge_connected) {
                        bridgeEl.textContent = 'Connected';
                        bridgeEl.className = 'text-sm status-online';
                    } else {
                        bridgeEl.textContent = 'Disconnected';
                        bridgeEl.className = 'text-sm status-warning';
                    }
                }
            } catch (error) {
                console.error('Error checking bridge status:', error);
                const bridgeEl = document.getElementById('bridge-status');
                if (bridgeEl) {
                    bridgeEl.textContent = 'Error';
                    bridgeEl.className = 'text-sm status-offline';
                }
            }
        }

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-20 right-4 p-4 rounded-lg shadow-lg z-50 alert-${type} animate-slide-in`;
            notification.innerHTML = `
                <div class="flex items-center space-x-2">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
            checkBridgeStatus();
            setInterval(checkBridgeStatus, 30000); // Check every 30 seconds
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
            if (reconnectInterval) {
                clearInterval(reconnectInterval);
            }
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
